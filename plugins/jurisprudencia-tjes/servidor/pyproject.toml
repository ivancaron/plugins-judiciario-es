[project]
name = "tjes-juris-mcp"
version = "0.1.0"
description = "Servidor MCP local de pesquisa na jurisprudência pública do TJES"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "truststore>=0.10",
]

[project.scripts]
tjes-juris-mcp = "tjes_juris_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tjes_juris_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["rede: consulta a API pública do tribunal; fica fora da suíte padrão"]
addopts = "-m 'not rede'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
